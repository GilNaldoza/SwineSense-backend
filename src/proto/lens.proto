syntax = "proto3";

package lens;

service LensSyncService {
  // Authentication
  rpc Login (LoginRequest) returns (LoginResponse);

  // Sync Data - Users and Logs
  rpc SyncUsers (stream User) returns (stream SyncResult); 
  rpc PushLogs (LogBatch) returns (SyncResult);
  rpc PullUsers (PullRequest) returns (UserList);
  rpc PushUsers (UserList) returns (SyncResult);

  // Sync Data - Pigs and Pig Scans
  rpc PullPigs (PullRequest) returns (PigList);
  rpc PushPigs (PigList) returns (SyncResult);
  rpc PushPigScans (PigScanBatch) returns (SyncResult);

  // Real-time signals from server (e.g. "Sync Now")
  rpc ListenForSignals (SignalRequest) returns (stream SignalMessage);
}

message SignalRequest {
  string node_id = 1;
  string token = 2;
}

message SignalMessage {
  string command = 1; // e.g. "SYNC_NOW", "CONFIG_UPDATE"
  string payload = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string node_id = 3;
}

message LoginResponse {
  string token = 1;
  bool success = 2;
  string message = 3;
}

message User {
  int32 user_id = 1; // Server ID
  string id_number = 2;
  string rfid_tag = 3;
  string first_name = 4;
  string last_name = 5;
  string email = 6;
  string user_type = 7;
  string college = 8;
  string department = 9;
  string year_level = 10;
  string status = 11;
  string updated_at = 12; // ISO String
}

message UserList {
  repeated User users = 1;
}

message PullRequest {
  string last_sync_timestamp = 1;
  string token = 2;
}

message LogEntry {
  string rfid_tag = 1;
  string entry_timestamp = 2;
  string entry_method = 3;
  string status = 4;
  string node_id = 5;
  string location = 6;
}

message LogBatch {
  repeated LogEntry logs = 1;
  string token = 2;
}

message SyncResult {
  bool success = 1;
  string message = 2;
  int32 items_processed = 3;
}

// ---- Pig Management ----

message Pig {
  string rfid_tag = 1;
  string pig_number = 2;
  string pig_type = 3;
  string sire = 4;
  string dam = 5;
  string pen = 6;
  string health_status = 7;
  string weight = 8;
  string date_of_birth = 9; // ISO string
  string notes = 10;
  string updated_at = 11; // ISO string
}

message PigList {
  repeated Pig pigs = 1;
}

message PigScan {
  string rfid_tag = 1;
  string timestamp = 2; // ISO string
  string location = 3;
  string notes = 4;
}

message PigScanBatch {
  repeated PigScan scans = 1;
  string token = 2;
}
