services:
  postgres:
    image: postgres:16
    container_name: swinesense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: USTPeLib2025
      POSTGRES_DB: swinesense_db
    ports:
      - "5432:5432"
    volumes:
      - swinesense_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  swinesense_db_data:
